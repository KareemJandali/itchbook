<text class="muted" x="523.1" y="412" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10.5">1.0M</text>
<line class="axis" x1="615.7" y1="92" x2="615.7" y2="394" stroke-dasharray="5 4"/>
<text class="ink" x="620.7" y="106.0" font-family="system-ui,sans-serif" font-size="11">max sustainable 3,356,066/s (800x)</text>
<line class="axis" x1="403.5" y1="92" x2="403.5" y2="394" stroke-dasharray="5 4"/>
<text class="ink" x="408.5" y="121.0" font-family="system-ui,sans-serif" font-size="11">knee 209,794/s (50x)</text>
<text class="muted" x="381" y="438" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11">offered rate (messages/second)</text>
<text class="muted" transform="translate(20,243) rotate(-90)" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11">latency (nanoseconds)</text>
