<text class="muted" x="381" y="438" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11">offered rate (messages/second)</text>
<text class="muted" transform="translate(20,243) rotate(-90)" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11">latency (nanoseconds)</text>
