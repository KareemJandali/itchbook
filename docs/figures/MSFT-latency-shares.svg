<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" role="img" aria-label="Fill volume vs one-way latency — touch-maker">
<style>
  .surface { fill: #fcfcfb; }
  .ink     { fill: #0b0b0b; }
  .muted   { fill: #52514e; }
  .grid    { stroke: #d8d7d2; stroke-width: 1; }
