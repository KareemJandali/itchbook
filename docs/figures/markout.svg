<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" role="img" aria-label="Post-fill drift — touch-maker">
<style>
  .surface { fill: #fcfcfb; }
  .ink     { fill: #0b0b0b; }
  .muted   { fill: #52514e; }
  /* Text drawn ON a filled mark, so it needs the surface colour, not ink. */
  .on-fill { fill: #fcfcfb; }
  .grid    { stroke: #d8d7d2; stroke-width: 1; }
  .axis    { stroke: #52514e; stroke-width: 1; }
  .s1 { fill: #2a78d6; stroke: #2a78d6; }
  .s2 { fill: #eb6834; stroke: #eb6834; }
  .s3 { fill: #1baf7a; stroke: #1baf7a; }
  .s4 { fill: #eda100; stroke: #eda100; }
  /* Stroke-only twins. A class that sets `fill` beats a fill="none"
     presentation attribute in the cascade, which silently turns every
     polyline into a filled blob. */
  .k1 { fill: none; stroke: #2a78d6; }
  .k2 { fill: none; stroke: #eb6834; }
  .k3 { fill: none; stroke: #1baf7a; }
  .k4 { fill: none; stroke: #eda100; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; }
    .ink     { fill: #ffffff; }
    .muted   { fill: #c3c2b7; }
    .on-fill { fill: #1a1a19; }
    .grid    { stroke: #3a3a38; }
    .axis    { stroke: #c3c2b7; }
    .s1 { fill: #3987e5; stroke: #3987e5; }
    .s2 { fill: #d95926; stroke: #d95926; }
    .s3 { fill: #199e70; stroke: #199e70; }
    .s4 { fill: #c98500; stroke: #c98500; }
    .k1 { stroke: #3987e5; }
    .k2 { stroke: #d95926; }
    .k3 { stroke: #199e70; }
    .k4 { stroke: #c98500; }
  }
</style>
<rect class="surface" width="780" height="430"/>
<text class="ink" x="16" y="26" font-family="system-ui,sans-serif" font-size="15" font-weight="600">Post-fill drift — touch-maker</text>
<text class="muted" x="16" y="46" font-family="system-ui,sans-serif" font-size="11.5">Positive is in your favour. Negative and worsening with the horizon means you are being picked off.</text>
<text class="muted" x="16" y="66" font-family="system-ui,sans-serif" font-size="11">cents/share</text>
