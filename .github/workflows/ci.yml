name: ci

# Every branch, not just main. Restricting this to main meant four phases of
# work were pushed to a feature branch without CI ever running, and the first
# run after merging failed on a warning clang catches and gcc does not.
on:
  push:
  pull_request:

jobs:
  # The README says which toolchain it was verified on, so CI has to be the
  # thing that verifies it. This job exists only to keep that sentence true:
  # gcc catches warnings clang does not and vice versa, and a second compiler
  # is the cheapest evidence that the code is portable rather than tuned to
  # one frontend. It builds and runs the unit tests; the long soaks and the
  # analysis stay in the clang job rather than being paid for twice.
  gcc-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build zlib1g-dev g++

      - name: Configure (Debug + sanitizers)
        env:
          CC: gcc
          CXX: g++
        run: cmake -S . -B build-gcc -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-gcc

      - name: Unit tests (C++)
        run: ctest --test-dir build-gcc --output-on-failure

  # A third job, because ThreadSanitizer and AddressSanitizer cannot share a
  # binary. Phase 10 is the first code here with two threads in it, and a
  # lock-free structure that has never been under a race detector is an
  # assertion rather than a result: the ring's whole safety argument is one
  # release/acquire pair, and x86-64's strong memory model would hide a missing
  # release behind correct-looking output for as long as anyone cared to run it.
  tsan-spsc-ring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build zlib1g-dev g++

      # Before trusting a green TSan job, prove TSan is armed. A runner without
      # the runtime, or a flag that silently did not apply, produces a job that
      # passes because it detected nothing -- which looks identical to a job
      # that passes because there was nothing to detect. This program has a
      # deliberate race and the step FAILS if the sanitizer does not catch it.
      - name: Prove the race detector detects races
        run: |
          cat > /tmp/race.cpp <<'CPP'
          #include <thread>
          int shared = 0;
          int main() {
            std::thread t([]{ for (int i = 0; i < 100000; ++i) shared++; });
            for (int i = 0; i < 100000; ++i) shared++;
            t.join();
          }
          CPP
          g++ -std=c++20 -fsanitize=thread -fno-omit-frame-pointer -g -O1 -o /tmp/race /tmp/race.cpp
          if /tmp/race 2>/tmp/race.err; then
            echo "TSan did not flag a deliberate data race -- the detector is not armed."
            cat /tmp/race.err
            exit 1
          fi
          grep -q "WARNING: ThreadSanitizer: data race" /tmp/race.err
          echo "TSan armed: a deliberate race is caught and the process exits non-zero."

      - name: Configure (ThreadSanitizer)
        env:
          CC: gcc
          CXX: g++
        run: cmake -S . -B build-tsan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DITCHBOOK_TSAN=ON

      - name: Build
        run: cmake --build build-tsan --target test_spsc_ring spsc_stress

      - name: Ring unit tests, race-detected
        run: ./build-tsan/test_spsc_ring

      # halt_on_error stops at the first race rather than reporting thousands of
      # instances of one bug. The stress run randomises batch sizes and stalls
      # both threads at random points, including between writing a slot and
      # publishing it -- the exact window the release store closes.
      #
      # It also fails if the ring never reached full AND never reached empty: a
      # run that stayed comfortably in the middle exercised no boundary and
      # proves nothing, however many operations it did.
      - name: Ring stress, race-detected
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ./build-tsan/spsc_stress --ops 20000000 --seed 3

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build zlib1g-dev clang

      - name: Configure (Debug + sanitizers)
        env:
          CC: clang
          CXX: clang++
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: Unit tests (C++)
        run: ctest --test-dir build --output-on-failure

      - name: Unit tests (Python oracle)
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Smoke test (generate sample, run tools)
        run: |
          python3 python/make_sample.py data/raw/sample.gz
          ./build/itch_census data/raw/sample.gz
          ./build/itch_dump   data/raw/sample.gz 5
          ./build/itch_slice  data/raw/sample.gz TEST data/sliced/TEST.gz

      # The census counts live orders with a structure that shares no code with
      # the book: no levels, no pool, twelve bytes per order instead of forty.
      # So the two arrive at "how many orders are resting" by different routes,
      # and phase 9 will lean on the census number to size a ref map for 8,700
      # symbols at once. Two independent counts of the same feed must agree, or
      # neither of them gets to be evidence.
      - name: Census and book agree on how many orders are live
        run: |
          python3 python/make_queue_feed.py data/raw/live.gz --messages 200000 \
            --gap-ns 20000 --seed 3
          ./build/itch_census  data/raw/live.gz --peak-orders | tee /tmp/census.txt
          ./build/book_replay  data/raw/live.gz --symbol TEST --json /tmp/book.json
          python3 - <<'PY'
          import json, re, sys
          census = open('/tmp/census.txt').read()
          live = int(re.search(r'live at end of file\s+(\d+)', census).group(1))
          unknown = int(re.search(r'references naming no live order\s+(\d+)', census).group(1))
          assert re.search(r'inserted == live \+ removed \+ emptied\s+yes', census), census
          book = json.load(open('/tmp/book.json'))
          print(f"census live={live} unknown={unknown} | "
                f"book resting={book['resting_orders']} unknown={book['unknown_refs']}")
          if live != book['resting_orders'] or unknown != book['unknown_refs']:
              sys.exit("census and book disagree about the same feed")
          PY

      # Phase 9 routes a whole feed into one BookSet. Nothing about that is
      # supposed to change what an individual book does -- the mutations are
      # the same code, reached through one more switch -- so the way to find
      # out whether routing broke a symbol is to reconstruct it both ways and
      # diff. A shared pool handing out the wrong node, a message routed to a
      # neighbour, a counter that became the market's instead of the symbol's:
      # none of those are visible to a run that only ever builds one book.
      #
      # Then one of those symbols is sliced out and graded against the Python
      # oracle, so the chain closes: all-symbols == single-symbol == oracle.
      # Phase 9 rewrote the inside of the book: the storage moved out from
      # under it, every order gained a field, and messages now arrive through a
      # router. None of that is supposed to change what a reconstruction
      # produces. This records a known feed's output and compares it byte for
      # byte -- snapshots, summary, and the all-symbols rows -- and it checks
      # the FEED's hash first, because a generator whose output moved and a
      # book whose output moved fail in the same place and mean opposite
      # things.
      # Standing rule 7: no number reaches a document by being retyped. The
      # census block in validation/README.md is generated from the committed
      # census JSON, and this fails if the prose has drifted from the data.
      - name: The census block matches the census
        run: python3 scripts/census-report.py --check

      # The phase 9 write-up is generated from the run's own artifacts. Its
      # numbers cannot drift from the run that produced them, because CI fails
      # if the committed prose disagrees with the committed data.
      - name: The phase 9 results match their artifacts
        run: python3 scripts/phase9-report.py --check

      - name: Regression gate (the same feed reconstructs to the same bytes)
        run: ./scripts/regression-gate.sh

      - name: All symbols equals every symbol one at a time
        run: |
          python3 python/make_queue_feed.py data/raw/multi.gz --messages 200000 \
            --locates 8 --seed 5
          ./build/book_replay data/raw/multi.gz --all-symbols \
            --per-symbol /tmp/per_symbol.csv | tee /tmp/all.txt
          python3 python/analysis/all_symbols_check.py data/raw/multi.gz \
            --binary build/book_replay --band-sweep 8 64 4096
          python3 - <<'PY'
          import re, sys
          text = open('/tmp/all.txt').read()
          def field(name):
              m = re.search(name + r'\s+([\d,]+)', text)
              return int(m.group(1).replace(',', '')) if m else None
          for name in ('unknown references', 'locate mismatches', 'undirectoried messages'):
              value = field(name)
              if value != 0:
                  sys.exit(f"{name} = {value}, must be 0 on a well-formed feed")
          if field('books built') != 8:
              sys.exit(f"expected 8 books, got {field('books built')}")
          print('all-symbols counters clean')
          PY
          ./build/itch_slice data/raw/multi.gz SY0003 data/sliced/SY0003.gz
          ./scripts/full-day-differential.sh data/sliced/SY0003.gz 1000 10

      # The other half of verification at scale. The oracle proves a symbol
      # right one symbol at a time and cannot chew a whole feed; these catch
      # what sampling misses -- a dropped message type, a double-counted
      # locate, volume lost between symbols. All correct per symbol, all wrong
      # in aggregate, all invisible to a per-symbol differential.
      - name: Global invariants (the census and the book agree in aggregate)
        run: |
          ./build/itch_census data/raw/multi.gz --peak-orders \
            --per-symbol /tmp/census.json
          ./build/book_replay data/raw/multi.gz --all-symbols \
            --json /tmp/run.json --per-symbol /tmp/per.csv --quiet
          python3 scripts/full-day-check.py --census /tmp/census.json \
            --run /tmp/run.json --per-symbol /tmp/per.csv

      - name: Smoke test (reference book replay)
        run: |
          python3 python/reference/replay.py data/raw/sample.gz --symbol TEST \
            --snapshots data/sliced/TEST_book.csv --interval-ms 5
          head -3 data/sliced/TEST_book.csv

      # The phase 3 done-condition: the C++ book and the Python oracle must
      # produce byte-identical snapshots. Not "close" — identical.
      - name: Differential test (sample feed)
        run: |
          ./build/book_replay data/raw/sample.gz --symbol TEST \
            --snapshots data/sliced/TEST_book_cpp.csv --interval-ms 5
          python3 python/analysis/book_diff.py \
            data/sliced/TEST_book.csv data/sliced/TEST_book_cpp.csv

      - name: Differential test (adversarial feeds)
        run: python3 tests/differential.py --binary build/book_replay --seeds 5

      # ctest already runs a short soak. This is a longer one, still bounded so
      # a push does not wait minutes for it.
      - name: Property fuzz the matching engine
        run: ./build/fuzz_matcher --iterations 1000000 --seed 1

      - name: Property fuzz the queue model
        run: ./build/fuzz_queue --iterations 200000 --seed 1

      # Phase 3's done-condition at the scale it was stated: "bit-identical
      # output to the Python oracle across a full trading day. Not 'close.'
      # Identical." Every other differential in this file runs on tens of
      # thousands of messages, which catches logic errors and cannot catch
      # anything that only appears after hours of session — a counter that
      # drifts, an accumulator that overflows, a path reached twice a day.
      # 1.2M messages is one liquid name for one day.
      - name: Full-day differential (1.2M messages, C++ vs the Python oracle)
        run: |
          python3 python/make_queue_feed.py data/raw/fullday.gz \
            --messages 1200000 --gap-ns 20000 --seed 3
          ./scripts/full-day-differential.sh data/raw/fullday.gz 1000 10

      # The degenerate day: orders entered and pulled, nothing ever trades, and
      # the book is empty at the close. Every quantity the summary reports is
      # then UNDEFINED — no touch, no OHLC, no VWAP — and the two
      # implementations have to spell that the same way. They did not: the C++
      # side wrote its -1 sentinels and a raw NUL for the trading state, which
      # is not merely a different value but an unparseable JSON file. Only a
      # real day surfaced it, because a generated feed ends with orders still
      # resting and something having traded.
      - name: Degenerate-day differential (empty book, no trades)
        run: |
          python3 -c "
          import gzip, sys
          sys.path.insert(0, 'python')
          import make_sample as gen
          t = gen.T0
          out = bytearray()
          for p in (gen.system_event(t, b'O'), gen.stock_directory(t, gen.SYMBOL),
                    gen.system_event(t, b'Q'),
                    gen.add_order(t + 1000, 1, b'B', 100, 1000000),
                    gen.add_order(t + 2000, 2, b'S', 100, 1000200),
                    gen.order_delete(t + 3000, 1), gen.order_delete(t + 4000, 2),
                    gen.system_event(t + 5000, b'M'), gen.system_event(t + 6000, b'C')):
              out.extend(gen.frame(p))
          gzip.open('data/raw/degenerate.gz', 'wb').write(bytes(out))
          "
          ./scripts/full-day-differential.sh data/raw/degenerate.gz 1000 10

      # Two independent implementations of the queue rules over identical bytes.
      # A queue model is a counterfactual with no ground truth, so agreement
      # between them is most of the assurance available before real data.
      - name: Differential test (queue model vs Python oracle)
        run: python3 tests/queue_differential.py --binary build/queue_sim --seeds 2

      # The framing layer must be transparent when nothing is wrong. Unit tests
      # build their own packets, so only pushing a real feed through the whole
      # path and comparing bytes catches a receiver that quietly drops one
      # message in ten thousand.
      - name: MoldUDP64 round trip (wrap, replay, compare bytes)
        run: |
          python3 python/make_queue_feed.py data/raw/rt.gz --seed 5 --messages 30000
          ./build/mold_wrap data/raw/rt.gz data/raw/rt.mold.gz --heartbeat-ns 1000000000
          ./build/mold_replay data/raw/rt.mold.gz --unwrap data/raw/rt.back.gz
          zcat data/raw/rt.gz > /tmp/rt-a.bin
          zcat data/raw/rt.back.gz > /tmp/rt-b.bin
          cmp /tmp/rt-a.bin /tmp/rt-b.bin
          echo "round trip identical: $(wc -c < /tmp/rt-a.bin) bytes"

      # Recovery, end to end. Knock a 20-packet hole in a wrapped feed — a
      # mid-day outage, roughly 800 consecutive messages — and require that
      # rebuild-forward converges back to a book byte-identical to the
      # undamaged one, and that the convergence detector notices.
      - name: Gap recovery (outage, rebuild, converge, compare books)
        run: |
          python3 python/make_queue_feed.py data/raw/rec.gz --seed 11 --messages 200000 \
            --gap-ns 300000
          ./build/mold_wrap data/raw/rec.gz data/raw/rec.mold.gz
          ./build/mold_damage data/raw/rec.mold.gz data/raw/rec.dmg.gz \
            --disconnect-at 5000 --disconnect-for 20
          ./build/mold_replay data/raw/rec.mold.gz --book-out /tmp/truth.csv --quiet
          # Exit 3 means messages were lost, which is the point of this run.
          ./build/mold_replay data/raw/rec.dmg.gz --book-out /tmp/recovered.csv \
            --quiet --recover-after 20000 > /tmp/recovered.txt || test $? -eq 3
          cat /tmp/recovered.txt
          grep -q "state                 trusted" /tmp/recovered.txt \
            || (echo "FAIL: never converged back to trusted" && exit 1)
          grep -q "recoveries            1" /tmp/recovered.txt \
            || (echo "FAIL: expected exactly one recovery" && exit 1)
          cmp /tmp/truth.csv /tmp/recovered.csv
          echo "recovered book identical to truth after an 800-message outage"

      # A restart is only worth having if it is transparent. Snapshot halfway
      # through a real feed, throw the book away, restore from the file, and
      # require the end state to match a run that never died — every order at
      # every price in queue order, plus the tape. The same step enforces the
      # conditional cross invariant: crossed while halted is legal and counted,
      # crossed while trading fails the build.
      - name: Restart recovery (snapshot, restore, compare to a run that never died)
        run: |
          ./build/restart_check data/raw/rec.gz --snapshot-file /tmp/mid.snap

      # Two quadratics lived in the simulator from the moment it was written
      # until a real 1.2M-message day exposed them — a six-point latency sweep
      # took the better part of an hour. Every existing test passed throughout,
      # because they are all about correctness and a quadratic is not wrong,
      # only ruinous. This asserts on the RATIO between two feed sizes rather
      # than a wall clock, so the runner's speed cancels out: double the input
      # and linear costs ~2x, quadratic ~4x. The pre-fix code measures 3.8x.
      - name: Scaling guard (the backtester must stay linear in feed length)
        run: python3 python/analysis/scaling_check.py --build build

      # The latency histogram is a build-plan deliverable and had no coverage
      # at all, so the whole path — bench -> bucket CSV -> SVG — could rot
      # without anything noticing until someone tried to regenerate the figure.
      # This asserts nothing about the timings, which mean nothing on a shared
      # runner; it asserts the pipeline still runs and produces a chart, in
      # both the single-run and the before/after form the plan asks for.
      - name: Latency histogram renders end to end
        run: |
          python3 python/make_bench_feed.py data/raw/hist.gz --messages 50000
          ./build/book_bench data/raw/hist.gz --histogram /tmp/after.csv
          ./build/book_bench data/raw/hist.gz --histogram /tmp/before.csv
          python3 python/analysis/latency_histogram.py /tmp/after.csv \
            --svg /tmp/latency.svg
          python3 python/analysis/latency_histogram.py /tmp/after.csv \
            --compare /tmp/before.csv --svg /tmp/latency-compare.svg
          for f in /tmp/latency.svg /tmp/latency-compare.svg; do
            test -s "$f"
            grep -q '</svg>' "$f"
            grep -q '<svg' "$f"
          done

      # The plan's testing table lists a Performance row whose stated purpose is
      # "Regressions", and for four phases it was measurement with nothing
      # comparing against it. This gates on the RATIO between two binaries built
      # here from the same source, differing only in the pool's chunk policy, so
      # the runner's speed cancels out. Thresholds are loose on purpose: 1.2x and
      # 10x against measured 1.6x and ~90x, because a gate set at the measured
      # value fails on noise and then gets disabled.
      - name: Performance regression gate (the pool change must still pay)
        run: python3 bench/regression_check.py --messages 300000

      # The phase 7 done-condition. Twelve scenarios of packet damage, each
      # graded CORRECT / SAFE / CAUTIOUS / WRONG. Any WRONG — the book diverged
      # while the system called itself trusted — fails the build. The feed here
      # is generated, not real: CI cannot carry licensed market data. The real
      # MSFT run is recorded in docs/phase7-results.md section 9.
      - name: Adversarial replay (drops, dups, reorders, truncation, an outage)
        run: python3 python/analysis/adversarial.py data/raw/rec.gz --build build

      # ...and prove the harness can actually fail, because a grader that only
      # ever returns CORRECT is worth nothing. Setting the convergence bar to a
      # single clean reference makes the system call itself trusted while its
      # book is still missing orders, which is precisely the silently-wrong
      # state, and the harness must catch it.
      - name: Adversarial harness self-test (it must detect silent wrongness)
        run: |
          if python3 python/analysis/adversarial.py data/raw/rec.gz --build build \
               --recover-after 1 > /tmp/selftest.txt 2>&1; then
            cat /tmp/selftest.txt
            echo "FAIL: the harness passed a run it should have failed"
            exit 1
          fi
          grep -q "WRONG" /tmp/selftest.txt
          echo "harness correctly reported silent wrongness at a bar of 1"

      # A feed with a closed form. Every number below is fixed by construction
      # before the simulator runs, so a disagreement is a defect rather than an
      # opinion — and all four models must agree, because the feed contains no
      # queue ambiguity for them to differ about.
      - name: Closed-form check (toxic feed)
        run: |
          python3 python/make_toxic_feed.py data/raw/toxic.gz --episodes 40
          ./build/queue_backtest data/raw/toxic.gz --strategy touch-maker \
            --json data/raw/toxic.json
          python3 python/make_toxic_feed.py --check data/raw/toxic.json --episodes 40

      # The one EXTERNAL check in phase 6: shadow real orders and grade the
      # models against what those orders actually filled. Partial fills only,
      # because an order that ended fully executed grades every model perfect
      # and measures nothing.
      - name: Leave-one-out oracle (fill models vs real orders)
        run: |
          python3 python/make_queue_feed.py data/raw/queue.gz --seed 3 --messages 40000
          python3 python/analysis/leave_one_out.py data/raw/queue.gz \
            --binary build/queue_sim --samples 40 --partial-only
